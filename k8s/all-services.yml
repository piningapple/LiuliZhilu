# PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: liulizhilu
spec:
  selector:
    app: postgres
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
---
# App
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: liulizhilu
spec:
  selector:
    app: app
  ports:
  - port: 8081
    targetPort: 8081
---
# Nginx
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: liulizhilu
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 81
    targetPort: 81
    nodePort: 30000
